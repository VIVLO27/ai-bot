# Render.com deployment config
# This tells Render how to build and run the backend

services:
  - type: web
    name: neuralchat-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_API_KEY
        sync: false   # Set this manually in Render dashboard
      - key: SESSION_SECRET
        generateValue: true  # Render auto-generates a secure secret
      - key: FRONTEND_URL
        sync: false   # Set to your Vercel URL after deploying frontend
